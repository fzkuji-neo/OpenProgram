<rect x="0" y="0" width="1760" height="1560" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="40" y="46" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#1f2328" text-anchor="start" font-weight="bold">OpenProgram — execution flow (unified · complete)</text><text x="40" y="72" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#656d76" text-anchor="start" font-weight="normal">Two entry points share one flow; retries, approval, and nesting use explicit decisions, branches, and loops.</text><rect x="40" y="96" width="18" height="18" rx="5" fill="#faf0ff" stroke="#8250df" stroke-width="1.6"/><text x="66" y="110" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Main steps</text><text x="66" y="127" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#656d76" text-anchor="start" font-weight="normal">Sequential</text><rect x="250" y="96" width="18" height="18" rx="5" fill="#eafbef" stroke="#1a7f37" stroke-width="1.6"/><text x="276" y="110" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Engine/tools</text><text x="276" y="127" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#656d76" text-anchor="start" font-weight="normal">Inside agent_loop</text><rect x="470" y="96" width="18" height="18" rx="5" fill="#ffeff7" stroke="#bf3989" stroke-width="1.6"/><text x="496" y="110" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Decision</text><text x="496" y="127" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#656d76" text-anchor="start" font-weight="normal">Diamond = branch</text><rect x="640" y="96" width="18" height="18" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/><text x="666" y="110" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Entry</text><text x="666" y="127" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#656d76" text-anchor="start" font-weight="normal">Trigger</text><rect x="70" y="150" width="560" height="58" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.8"/><text x="350.0" y="174" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">Entry A · user message (webui/CLI/channel)</text><text x="350.0" y="193" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">run_turn</text><rect x="1130" y="150" width="560" height="58" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.8"/><text x="1410.0" y="174" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">Entry B · @agentic_function body / decision.make</text><text x="1410.0" y="193" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">runtime.exec</text><rect x="600.0" y="260" width="560" height="170" rx="12" fill="#faf0ff" stroke="#8250df" stroke-width="2.2"/><text x="880.0" y="284" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">① Read context (assemble this input)</text><rect x="614.0" y="304" width="532" height="30" rx="7" fill="#fff" stroke="#8250df" stroke-width="1.2"/><circle cx="630.0" cy="319" r="9" fill="#8250df"/><text x="630.0" y="323" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="646.0" y="317" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="bold">compute_reads(full ROOT graph)</text><text x="646.0" y="330" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#656d76" text-anchor="start" font-weight="normal">Select nodes: accumulate chat / apply function frame + expose</text><rect x="614.0" y="337" width="532" height="30" rx="7" fill="#fff" stroke="#8250df" stroke-width="1.2"/><circle cx="630.0" cy="352" r="9" fill="#8250df"/><text x="630.0" y="356" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="646.0" y="350" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="bold">Render messages</text><text x="646.0" y="363" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#656d76" text-anchor="start" font-weight="normal">Nodes → provider messages (text/images/files)</text><rect x="614.0" y="370" width="532" height="30" rx="7" fill="#fff" stroke="#8250df" stroke-width="1.2"/><circle cx="630.0" cy="385" r="9" fill="#8250df"/><text x="630.0" y="389" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="646.0" y="383" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="bold">Build shared system prompt</text><text x="646.0" y="396" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#656d76" text-anchor="start" font-weight="normal">One per project: identity + memory + tools + skills (stable prefix → cache hit)</text><rect x="614.0" y="403" width="532" height="30" rx="7" fill="#fff" stroke="#8250df" stroke-width="1.2"/><circle cx="630.0" cy="418" r="9" fill="#8250df"/><text x="630.0" y="422" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="646.0" y="416" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="bold">Check compaction budget</text><text x="646.0" y="429" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#656d76" text-anchor="start" font-weight="normal">Over budget → summarize early history</text><path d="M 350.0 208 L 350.0 234.0 L 810.0 234.0 L 810.0 260" stroke="#0969da" stroke-width="2.6" fill="none" marker-end="url(#a)"/><path d="M 1410.0 208 L 1410.0 234.0 L 950.0 234.0 L 950.0 260" stroke="#0969da" stroke-width="2.6" fill="none" marker-end="url(#a)"/><text x="880.0" y="250" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#bf3989" text-anchor="middle" font-weight="bold">Both entries share this flow and system prompt</text><rect x="600.0" y="474" width="560" height="58" rx="12" fill="#faf0ff" stroke="#8250df" stroke-width="2.2"/><text x="880.0" y="498" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">② open_call_node</text><text x="880.0" y="516" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">Open llm node (running) · _call_id points to it (tool code nodes use called_by)</text><path d="M 880.0 430 L 880.0 474" stroke="#57606a" stroke-width="2.6" fill="none" marker-end="url(#a)"/><rect x="600.0" y="582" width="560" height="46" rx="12" fill="#eafbef" stroke="#1a7f37" stroke-width="2.2"/><text x="880.0" y="606" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">③ agent_loop (shared engine · loop)</text><path d="M 880.0 532 L 880.0 582" stroke="#57606a" stroke-width="2.6" fill="none" marker-end="url(#a)"/><rect x="640.0" y="662" width="480" height="52" rx="12" fill="#eafbef" stroke="#1a7f37" stroke-width="2.2"/><circle cx="664.0" cy="686" r="13" fill="#1a7f37"/><text x="664.0" y="691" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="686.0" y="684" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Model call / streaming</text><text x="686.0" y="702" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">Send context to model; stream the response</text><path d="M 880.0 628 L 880.0 662" stroke="#57606a" stroke-width="2.6" fill="none" marker-end="url(#a)"/><polygon points="530.0,648 592.0,688 530.0,728 468.0,688" fill="#ffeff7" stroke="#bf3989" stroke-width="2"/><text x="530.0" y="684" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">Error?</text><text x="530.0" y="701" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#656d76" text-anchor="middle" font-weight="normal">Retryable?</text><path d="M 640.0 688 L 592.0 688" stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="622.0" y="684.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#bf3989" text-anchor="middle" font-weight="bold">Failure</text><path d="M 530.0 728 L 530.0 812 L 880.0 812 L 880.0 714" stroke="#bf3989" stroke-width="2.2" fill="none" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="452.0" y="754" width="156" height="40" rx="8" fill="#ffeff7" stroke="#bf3989" stroke-width="1.6"/><text x="535.0" y="776" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="bold">Retry with backoff + jitter</text><text x="535.0" y="790" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#656d76" text-anchor="middle" font-weight="normal">Yes · attempt &lt; max</text><path d="M 530.0 648 L 530.0 618" stroke="#bf3989" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="458.0" y="576" width="144" height="40" rx="8" fill="#fff" stroke="#bf3989" stroke-width="1.6"/><text x="530.0" y="596" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="bold">No / exhausted → error</text><text x="530.0" y="610" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#656d76" text-anchor="middle" font-weight="normal">close(status=error)</text><polygon points="880.0,744 960.0,784 880.0,824 800.0,784" fill="#ffeff7" stroke="#bf3989" stroke-width="2"/><text x="880.0" y="780" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">Response has</text><text x="880.0" y="797" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#656d76" text-anchor="middle" font-weight="normal">tool_use?</text><path d="M 880.0 714 L 880.0 744" stroke="#57606a" stroke-width="2.6" fill="none" marker-end="url(#a)"/><path d="M 960.0 784 L 1140.0 784" stroke="#57606a" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="1056.0" y="780.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#bf3989" text-anchor="middle" font-weight="bold">No · text only</text><rect x="1140.0" y="762" width="150" height="44" rx="10" fill="#eafbef" stroke="#1a7f37" stroke-width="1.8"/><text x="1215.0" y="786" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">End loop → ④</text><polygon points="880.0,848 960.0,888 880.0,928 800.0,888" fill="#ffeff7" stroke="#bf3989" stroke-width="2"/><text x="880.0" y="884" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">Approval?</text><text x="880.0" y="901" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#656d76" text-anchor="middle" font-weight="normal">(permission)</text><path d="M 880.0 824 L 880.0 848" stroke="#57606a" stroke-width="2.6" fill="none" marker-end="url(#a)"/><text x="886.0" y="832.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#bf3989" text-anchor="middle" font-weight="bold">Yes</text><path d="M 800.0 888 L 556.0 888" stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="684.0" y="884.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#bf3989" text-anchor="middle" font-weight="bold">Needed · wait</text><rect x="380.0" y="854" width="176" height="68" rx="10" fill="#ffeff7" stroke="#bf3989" stroke-width="1.6"/><text x="468.0" y="876" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2328" text-anchor="middle" font-weight="bold">Await approval</text><text x="468.0" y="896" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#656d76" text-anchor="middle" font-weight="normal">Approved → continue</text><text x="468.0" y="914" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#656d76" text-anchor="middle" font-weight="normal">Denied → error to model</text><rect x="640.0" y="982" width="480" height="52" rx="12" fill="#eafbef" stroke="#1a7f37" stroke-width="2.2"/><circle cx="664.0" cy="1006" r="13" fill="#1a7f37"/><text x="664.0" y="1011" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="686.0" y="1004" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Run tools: _execute_tool_calls</text><text x="686.0" y="1022" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">Write code node (called_by = current llm); run when approved or approval is unnecessary</text><path d="M 880.0 928 L 880.0 982" stroke="#57606a" stroke-width="2.6" fill="none" marker-end="url(#a)"/><text x="886.0" y="951.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#bf3989" text-anchor="middle" font-weight="bold">None / approved</text><polygon points="880.0,1048 970.0,1088 880.0,1128 790.0,1088" fill="#ffeff7" stroke="#bf3989" stroke-width="2"/><text x="880.0" y="1084" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">Tool is</text><text x="880.0" y="1101" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#656d76" text-anchor="middle" font-weight="normal">@agentic_function?</text><path d="M 880.0 1034 L 880.0 1048" stroke="#57606a" stroke-width="2.6" fill="none" marker-end="url(#a)"/><path d="M 970.0 1088 L 1240.0 1088 L 1240.0 256 L 950.0 256" stroke="#1a7f37" stroke-width="2.4" fill="none" stroke-dasharray="7 5" marker-end="url(#ag)"/><text x="1250.0" y="1080" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#1a7f37" text-anchor="start" font-weight="bold">Yes → body calls exec again</text><text x="1250.0" y="1096" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#656d76" text-anchor="start" font-weight="normal">= return to ① (nested call)</text><text x="1250.0" y="1112" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#656d76" text-anchor="start" font-weight="normal">Same system prompt; cache still applies</text><text x="1250.0" y="1128" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#656d76" text-anchor="start" font-weight="normal">wiki_agent recursion uses this path</text><rect x="640.0" y="1172" width="480" height="46" rx="12" fill="#eafbef" stroke="#1a7f37" stroke-width="2.2"/><circle cx="664.0" cy="1196" r="13" fill="#1a7f37"/><text x="664.0" y="1201" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="686.0" y="1194" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Return result → model call</text><text x="686.0" y="1212" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">No: ordinary tool returns a result; append to context and continue</text><path d="M 880.0 1128 L 880.0 1172" stroke="#57606a" stroke-width="2.6" fill="none" marker-end="url(#a)"/><text x="886.0" y="1146.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#bf3989" text-anchor="middle" font-weight="bold">No</text><path d="M 640.0 1195 L 490.0 1195 L 490.0 688 L 452.0 688" stroke="#1a7f37" stroke-width="2.2" fill="none" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="470.0" y="1216" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1a7f37" text-anchor="start" font-weight="bold">Loop back with the tool result</text><rect x="600.0" y="1274" width="560" height="58" rx="12" fill="#faf0ff" stroke="#8250df" stroke-width="2.2"/><text x="880.0" y="1298" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">④ close_call_node</text><text x="880.0" y="1316" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">Write output to llm node from ② · token columns / blocks / usage · status = success/cancelled/error</text><path d="M 1215.0 806 L 1215.0 1254 L 1160.0 1274" stroke="#57606a" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="370.0" y="568" width="1380.0" height="706" rx="16" fill="none" stroke="#9a6700" stroke-width="2" stroke-dasharray="9 6"/><text x="380.0" y="560" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#9a6700" text-anchor="start" font-weight="bold">Whole-call scope: timeout timer · cancellation interrupts at any time · accumulate usage · on error → close(status=error)</text>
</svg>